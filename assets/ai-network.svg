<svg width="900" height="560" viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#050014"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#04202c"/>
      <stop offset="100%" stop-color="#0c1030"/>
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#7b5cff"/>
    </linearGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#0af0ff" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="900" height="560" rx="16" fill="url(#bg2)"/>
  <rect width="900" height="560" rx="16" fill="url(#grid2)"/>
  <rect x="1.5" y="1.5" width="897" height="557" rx="15" fill="none" stroke="#123245"/>

  <text x="450" y="40" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" letter-spacing="3" fill="#7be9ff">[ AI.STACK :: PIPELINE ARCHITECTURE ]</text>

  <!-- connecting spine -->
  <line x1="450" y1="70" x2="450" y2="520" stroke="url(#edgeGrad)" stroke-width="2" opacity="0.5">
    <animate attributeName="opacity" values="0.25;0.6;0.25" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- nodes: AI, ML, DL, NLP, GenAI, LLMs, RAG, Applications -->
  <!-- generic node macro replicated manually -->
  <g font-family="'Segoe UI',Arial,sans-serif">

    <!-- node 1 -->
    <g transform="translate(450,90)">
      <circle r="34" fill="url(#nodeFill)" stroke="#00f5ff" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="13" fill="#e8f9ff" font-weight="600">AI</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Artificial Intelligence</text>
    </g>

    <!-- node 2 -->
    <g transform="translate(450,160)">
      <circle r="34" fill="url(#nodeFill)" stroke="#00f5ff" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="12" fill="#e8f9ff" font-weight="600">ML</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Machine Learning</text>
    </g>

    <!-- node 3 -->
    <g transform="translate(450,230)">
      <circle r="34" fill="url(#nodeFill)" stroke="#7b5cff" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="12" fill="#e8f9ff" font-weight="600">DL</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Deep Learning</text>
    </g>

    <!-- node 4 -->
    <g transform="translate(450,300)">
      <circle r="34" fill="url(#nodeFill)" stroke="#7b5cff" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.8s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="11.5" fill="#e8f9ff" font-weight="600">NLP</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Natural Language Processing</text>
    </g>

    <!-- node 5 -->
    <g transform="translate(450,370)">
      <circle r="34" fill="url(#nodeFill)" stroke="#e8c66b" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="10.5" fill="#e8f9ff" font-weight="600">GenAI</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Generative AI</text>
    </g>

    <!-- node 6 -->
    <g transform="translate(450,440)">
      <circle r="34" fill="url(#nodeFill)" stroke="#e8c66b" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="1;0.4;1" dur="2.3s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="5" font-size="11" fill="#e8f9ff" font-weight="600">LLMs</text>
      <text x="60" y="5" font-size="13" fill="#c9e9f5">Large Language Models</text>
    </g>

    <!-- node 7 -->
    <g transform="translate(450,500)">
      <circle r="30" fill="url(#nodeFill)" stroke="#00f5ff" stroke-width="1.6" filter="url(#glow2)">
        <animate attributeName="stroke-opacity" values="0.4;1;0.4" dur="2.1s" repeatCount="indefinite"/>
      </circle>
      <text text-anchor="middle" dy="4" font-size="10.5" fill="#e8f9ff" font-weight="600">RAG</text>
      <text x="56" y="5" font-size="13" fill="#c9e9f5">Retrieval-Augmented Generation</text>
    </g>

  </g>

  <!-- flowing particles on spine -->
  <circle r="3.5" fill="#00f5ff">
    <animateMotion path="M450,70 L450,520" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#7b5cff">
    <animateMotion path="M450,70 L450,520" dur="3.5s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
  <circle r="3.5" fill="#e8c66b">
    <animateMotion path="M450,70 L450,520" dur="3.5s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <text x="450" y="545" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#5f8fa3" letter-spacing="2">→ AI APPLICATIONS &amp; INTELLIGENT SYSTEMS</text>
</svg>
