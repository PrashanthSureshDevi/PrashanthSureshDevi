<svg width="1100" height="320" viewBox="0 0 1100 320" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020409">
        <animate attributeName="stop-color" values="#020409;#031018;#020409" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#03121a">
        <animate attributeName="stop-color" values="#03121a;#04182a;#03121a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050014">
        <animate attributeName="stop-color" values="#050014;#0a0022;#050014" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="45%" stop-color="#7b5cff"/>
      <stop offset="100%" stop-color="#00f5ff">
        <animate attributeName="offset" values="1;0.6;1" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8c66b"/>
      <stop offset="100%" stop-color="#00f5ff"/>
    </linearGradient>

    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#0af0ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1100" height="320" rx="18" fill="url(#bgGrad)"/>
  <rect width="1100" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1097" height="317" rx="17" fill="none" stroke="#123245" stroke-width="1.4"/>

  <!-- scanning sweep -->
  <rect x="-260" y="0" width="260" height="320" fill="url(#nodeGlow)" opacity="0.06">
    <animateTransform attributeName="transform" type="translate" values="0 0; 1360 0" dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- neural network -->
  <g stroke="#1fd7ff" stroke-opacity="0.35" stroke-width="1.1">
    <path d="M60,60 L180,120 L60,180" fill="none">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M180,120 L300,70 L400,140" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;0.15;0.5" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M60,180 L180,120 L300,200" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;0.55;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M300,70 L300,200" fill="none">
      <animate attributeName="stroke-opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M950,50 L1030,110 L960,180 L1030,240" fill="none">
      <animate attributeName="stroke-opacity" values="0.15;0.5;0.15" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <path d="M1030,110 L950,180" fill="none">
      <animate attributeName="stroke-opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#glow)">
    <circle cx="60" cy="60" r="4.4" fill="#00f5ff">
      <animate attributeName="r" values="3.2;5.4;3.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="120" r="5.4" fill="#7b5cff">
      <animate attributeName="r" values="4;6.4;4" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="180" r="4" fill="#00f5ff">
      <animate attributeName="r" values="3;5;3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="70" r="4.4" fill="#e8c66b">
      <animate attributeName="r" values="3;5.2;3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="200" r="4" fill="#00f5ff">
      <animate attributeName="r" values="3;5;3" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="140" r="5" fill="#7b5cff">
      <animate attributeName="r" values="3.6;5.8;3.6" dur="2.6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="950" cy="50" r="4" fill="#00f5ff">
      <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="110" r="5" fill="#e8c66b">
      <animate attributeName="r" values="3.5;5.6;3.5" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="180" r="4.2" fill="#7b5cff">
      <animate attributeName="r" values="3;5.2;3" dur="2.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1030" cy="240" r="4" fill="#00f5ff">
      <animate attributeName="r" values="3;5;3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating particles -->
  <g fill="#7be9ff">
    <circle cx="500" cy="40" r="1.6" opacity="0.7">
      <animate attributeName="cy" values="40;300;40" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="620" cy="260" r="1.8" opacity="0.6">
      <animate attributeName="cy" values="260;20;260" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="150" r="1.4" opacity="0.6">
      <animate attributeName="cy" values="150;10;150" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="820" cy="80" r="1.6" opacity="0.5">
      <animate attributeName="cy" values="80;280;80" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.6;0" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#00f5ff" stroke-width="1.6" fill="none" opacity="0.5">
    <path d="M24,24 L24,44 M24,24 L44,24"/>
    <path d="M1076,24 L1076,44 M1076,24 L1056,24"/>
    <path d="M24,296 L24,276 M24,296 L44,296"/>
    <path d="M1076,296 L1076,276 M1076,296 L1056,296"/>
  </g>

  <!-- main text -->
  <text x="480" y="132" font-family="'Courier New', monospace" font-size="13" fill="#7be9ff" letter-spacing="4" opacity="0.85">SYSTEM.INIT :: IDENTITY VERIFIED</text>

  <text x="480" y="185" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="700" fill="url(#textGrad)" filter="url(#glow)">
    PRASHANTH S
  </text>

  <text x="480" y="220" font-family="'Courier New', monospace" font-size="17" fill="url(#goldGrad)" letter-spacing="2">
    AI / ML ENGINEER IN PROGRESS
  </text>

  <text x="480" y="252" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#8fa6b8">
    Engineering intelligent systems with Python, Machine Learning,
  </text>
  <text x="480" y="270" font-family="'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#8fa6b8">
    LLMs, NLP, RAG &amp; Generative AI.
  </text>

  <!-- terminal cursor -->
  <rect x="856" y="240" width="10" height="16" fill="#00f5ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
