<svg width="820" height="330" viewBox="0 0 820 330" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050914"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <filter id="tglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="820" height="330" rx="14" fill="url(#termBg)" stroke="#123245" stroke-width="1.4"/>

  <!-- title bar -->
  <rect x="0" y="0" width="820" height="34" rx="14" fill="#0b1622"/>
  <rect x="0" y="20" width="820" height="14" fill="#0b1622"/>
  <circle cx="24" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="17" r="6" fill="#27c93f"/>
  <text x="410" y="21" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#5f8fa3">prashanth@ai-dev-terminal: ~</text>

  <g font-family="'Courier New',monospace" font-size="15.5" fill="#7be9ff">
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.02;0.08;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="66"><tspan fill="#e8c66b">$</tspan> whoami</text>
      <text x="24" y="90" fill="#e8f9ff">Prashanth S</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.14;0.20;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="124"><tspan fill="#e8c66b">$</tspan> focus</text>
      <text x="24" y="148" fill="#e8f9ff">AI / ML Engineering</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.26;0.32;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="182"><tspan fill="#e8c66b">$</tspan> learning</text>
      <text x="24" y="206" fill="#e8f9ff">LLMs • NLP • RAG • Generative AI</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.44;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="240"><tspan fill="#e8c66b">$</tspan> coding</text>
      <text x="24" y="264" fill="#e8f9ff">Python • C • JavaScript • SQL</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.50;0.56;1" dur="12s" repeatCount="indefinite"/>
      <text x="24" y="298"><tspan fill="#e8c66b">$</tspan> goal</text>
      <text x="470" y="298" fill="#00f5ff" filter="url(#tglow)">Build intelligent systems.</text>
    </g>
  </g>

  <!-- blinking cursor -->
  <rect x="24" y="306" width="10" height="16" fill="#00f5ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
